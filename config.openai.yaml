name: aelio-openai
secret: ${AELIO_SDK_SECRET}

llm:
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  max_tokens: 1024

# Real semantic embeddings for memory recall + response cache (defaults to the
# built-in 'hash' embedding if omitted). 'openai' uses text-embedding-3-small (1536d).
embeddings:
  provider: openai
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}
  output_dimension: 1536

channels:
  whatsapp:
    enabled: true
    mock_mode: true
    verify_token: test-verify-token
    webhook_path: /wa/webhook
  web:
    enabled: true
    allowed_origins:
      - "*"
    magic_link:
      enabled: true
      ttl_minutes: 15

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]
  overrides:
    cancelOrder:
      mode: write
      require_confirmation: true

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

memory:
  enabled: true
  recall_limit: 5

storage:
  database_path: ./data/aelio-openai.db

logging:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 3010
