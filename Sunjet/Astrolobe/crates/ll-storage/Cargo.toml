[package]
name = "ll-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Segment store backends for Astrolobe: local disk and S3-compatible object storage."

[dependencies]
object_store = { version = "0.11", features = ["aws"], default-features = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
