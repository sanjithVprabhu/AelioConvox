name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, rishabh-dev]
  pull_request:

jobs:
  aelio-os:
    name: Aelio OS (Rust 1.75)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aelio-os
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aelio-os

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --release --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: AELIO_TEST_MODE=1 OPENAI_API_KEY= GEMINI_API_KEY= ANTHROPIC_API_KEY= pnpm test:all
      - run: AELIO_TEST_MODE=1 OPENAI_API_KEY= pnpm test:phase6:lifecycle

  live-provider:
    name: Opt-in live OpenAI architecture matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aelio-os
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aelio-os
      - name: Require live-provider credential
        run: test -n "$OPENAI_API_KEY"
      - name: Run ignored live E2E cases explicitly
        run: cargo test -p aelio-agent --features direct-provider-tests --test live_llm_e2e -- --ignored --nocapture
      - name: Run ignored live architecture case explicitly
        run: cargo test -p aelio-agent --features direct-provider-tests --test live_llm_architecture -- --ignored --nocapture
