name: CI

on:
  push:
    branches: [main, rishabh-dev]
  pull_request:

jobs:
  aelio-os:
    name: Aelio OS (Rust 1.75)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aelio-os
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aelio-os

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --release --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: AELIO_TEST_MODE=1 OPENAI_API_KEY= GEMINI_API_KEY= ANTHROPIC_API_KEY= pnpm test:all
      - run: AELIO_TEST_MODE=1 OPENAI_API_KEY= pnpm test:phase6:lifecycle
