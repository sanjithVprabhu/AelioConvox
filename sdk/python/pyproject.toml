[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aelio-sdk"
version = "0.1.0"
description = "Aelio SDK for Python — expose backend functions to the Aelio conversational runtime over a single outbound WebSocket."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Aelio" }]
keywords = ["aelio", "sdk", "conversational", "ai", "agent", "whatsapp", "chatbot"]
dependencies = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/aelio-dev/aelio"
Repository = "https://github.com/aelio-dev/aelio"
Issues = "https://github.com/aelio-dev/aelio/issues"

[tool.hatch.build.targets.wheel]
include = ["sdk.py"]

[tool.hatch.build.targets.sdist]
include = ["sdk.py", "README.md"]
