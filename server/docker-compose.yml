services:
  aelio:
    image: ${AELIO_IMAGE:-sanjithvprabhu/aelio-server:latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${AELIO_PUBLISH_PORT:-3010}:3000"
    volumes:
      - aelio-data:/data
    environment:
      AELIO_CONFIG: /app/config.yaml
      AELIO_SDK_SECRET: ${AELIO_SDK_SECRET:?set AELIO_SDK_SECRET}
      AELIO_INTERNAL_TOKEN: ${AELIO_INTERNAL_TOKEN:?set AELIO_INTERNAL_TOKEN (32+ chars)}
      # Optional immutable override. Without both values the Rust-owned
      # aelio.conversation@1 fallback is installed idempotently at startup.
      AELIO_LLM_PROVIDER: ${AELIO_LLM_PROVIDER:-openai}
      AELIO_LLM_MODEL: ${AELIO_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AELIO_WEB_ALLOWED_ORIGINS: ${AELIO_WEB_ALLOWED_ORIGINS:-}
      AELIO_REQUIRE_LLM_KEY: ${AELIO_REQUIRE_LLM_KEY:-1}
      AELIO_DB_SEGMENT_BACKEND: ${AELIO_DB_SEGMENT_BACKEND:-local}
      AELIO_DB_SEGMENT_PREFIX: ${AELIO_DB_SEGMENT_PREFIX:-}
      AELIO_DB_S3_BUCKET: ${AELIO_DB_S3_BUCKET:-}
      AELIO_DB_S3_REGION: ${AELIO_DB_S3_REGION:-}
      AELIO_DB_S3_ENDPOINT: ${AELIO_DB_S3_ENDPOINT:-}
      AELIO_DB_S3_ACCESS_KEY_ID: ${AELIO_DB_S3_ACCESS_KEY_ID:-}
      AELIO_DB_S3_SECRET_ACCESS_KEY: ${AELIO_DB_S3_SECRET_ACCESS_KEY:-}
      AELIO_DB_S3_ALLOW_HTTP: ${AELIO_DB_S3_ALLOW_HTTP:-}
      AELIO_DB_S3_PATH_STYLE: ${AELIO_DB_S3_PATH_STYLE:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

volumes:
  aelio-data:
