services:
  aelio:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - aelio-data:/data
    environment:
      AELIO_CONFIG: /app/config.yaml
      AELIO_SDK_SECRET: ${AELIO_SDK_SECRET:-change-me-in-production}
      # Default provider is OpenAI; provide OPENAI_API_KEY for real responses
      # (without it the server degrades to the mock LLM and logs a warning).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  aelio-data: