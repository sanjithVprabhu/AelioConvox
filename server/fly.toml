app = "aelio-server"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  AELIO_CONFIG = "/app/config.yaml"
  AELIO_SDK_SECRET = "change-me-in-production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "aelio_data"
  destination = "/data"