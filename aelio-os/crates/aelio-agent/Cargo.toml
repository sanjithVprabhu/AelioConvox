[package]
name = "aelio-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aelio conversational harness: typed ability runtime, turn spine, learning tier ladder."
authors.workspace = true

[features]
default = []
# Compatibility-only vendor dialer for ignored live tests. Production must use TsGatewayProvider.
direct-provider-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
aelio-db-query = { path = "../aelio-db-query" }
aelio-render = { path = "../aelio-render" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
pretty_assertions = "1"
