name: aelio-docker
secret: ${AELIO_SDK_SECRET}

llm:
  provider: mock
  model: mock-model
  max_tokens: 4096

channels:
  whatsapp:
    enabled: true
    mock_mode: true
    verify_token: test-verify-token
    webhook_path: /wa/webhook
  web:
    enabled: true
    # Do NOT use "*" in production. Set AELIO_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
    # or list origins below. Unresolved placeholders are stripped at load time.
    allowed_origins:
      - ${AELIO_ALLOWED_ORIGIN}
    magic_link:
      enabled: true
      ttl_minutes: 15
      require_sdk_auth: true
      rate_limit_per_minute: 5

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]
  overrides:
    cancelOrder:
      mode: write
      require_confirmation: true

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

memory:
  enabled: true
  recall_limit: 5

storage:
  database_path: /data/aelio.db

logging:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 3000
