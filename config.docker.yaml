name: aelio-docker
secret: ${AELIO_SDK_SECRET}

llm:
  # -e AELIO_LLM_PROVIDER=anthropic|openai|gemini|groq|ollama|mock
  # -e AELIO_LLM_MODEL=...
  # Keys: OPENAI_API_KEY | ANTHROPIC_API_KEY | GEMINI_API_KEY | GROQ_API_KEY
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  max_tokens: 4096

# Real vectors for Sunjet semantic search (must match sunjet.embed_dim).
# Override: AELIO_EMBEDDINGS_PROVIDER=openai|hash|gemini|anthropic|ollama
embeddings:
  provider: openai
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}
  output_dimension: 1536

channels:
  whatsapp:
    enabled: true
    mock_mode: true
    verify_token: test-verify-token
    webhook_path: /wa/webhook
  web:
    enabled: true
    allowed_origins:
      - "*"
    magic_link:
      enabled: true
      ttl_minutes: 15

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]
  overrides:
    cancelOrder:
      mode: write
      require_confirmation: true

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

memory:
  enabled: true
  recall_limit: 5

# Astrolobe is the sole message/state store (see docker entrypoint) — Aelio is
# Sunjet-only and has no SQLite fallback.
sunjet:
  enabled: true
  url: http://127.0.0.1:8080
  api_key: ${SUNJET_API_KEY}
  embed_dim: 1536
  segment_storage:
    backend: local

logging:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 3000
