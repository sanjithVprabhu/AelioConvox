name: aelio-docker
secret: ${AELIO_SDK_SECRET}

llm:
  provider: mock
  model: mock-model
  max_tokens: 4096

channels:
  whatsapp:
    enabled: true
    mock_mode: true
    verify_token: test-verify-token
    webhook_path: /wa/webhook
  web:
    enabled: true
    allowed_origins:
      - "*"
    magic_link:
      enabled: true
      ttl_minutes: 15

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]
  overrides:
    cancelOrder:
      mode: write
      require_confirmation: true

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

memory:
  enabled: true
  recall_limit: 5

storage:
  database_path: /data/aelio.db

logging:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 3000