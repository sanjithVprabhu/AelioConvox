name: aelio-gemini
secret: ${AELIO_SDK_SECRET}

llm:
  provider: gemini
  model: gemini-2.0-flash
  api_key: ${GEMINI_API_KEY}
  max_tokens: 4096

embeddings:
  provider: gemini
  model: text-embedding-004
  api_key: ${GEMINI_API_KEY}
  output_dimension: 768

channels:
  whatsapp:
    enabled: false
  web:
    enabled: true
    allowed_origins:
      - "*"

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

memory:
  enabled: true
  recall_limit: 5

aelioDb:
  enabled: false
  embed_dim: 768

storage:
  database_path: ./data/aelio-gemini.db

logging:
  level: info
  format: pretty

server:
  host: 0.0.0.0
  port: 3003