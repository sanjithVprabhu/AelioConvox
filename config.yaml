name: aelio-local
secret: ${AELIO_SDK_SECRET}

llm:
  # anthropic | openai | gemini | groq | ollama | mock
  # Default: OpenAI (GPT). Set OPENAI_API_KEY for real responses; without a key
  # the server degrades to the mock LLM in dev (and hard-fails in production).
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  max_tokens: 4096

# Semantic embeddings for memory + Sunjet vectors (hash = local, no API).
# openai: text-embedding-3-small (1536d)
# gemini: text-embedding-004 (768d — set sunjet.embed_dim: 768)
# anthropic: voyage-3-lite via Voyage API (set VOYAGE_API_KEY)
embeddings:
  provider: hash
  model: text-embedding-3-small

channels:
  whatsapp:
    enabled: true
    mock_mode: true
    verify_token: test-verify-token
    webhook_path: /wa/webhook
  web:
    enabled: true
    # Origins allowed to open the widget WebSocket. Matched exactly on
    # scheme+host+port, so localhost and 127.0.0.1 are distinct. Use ["*"] to
    # allow any origin, or leave empty to disable the origin check (dev only).
    allowed_origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
    magic_link:
      enabled: true
      ttl_minutes: 15

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]
  overrides:
    cancelOrder:
      mode: write
      require_confirmation: true

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

intent:
  enabled: true
  ttl_minutes: 20
  max_depth: 5

memory:
  enabled: true
  recall_limit: 5

# The harness — the plan-execute-replan turn engine. Enabled by default; set
# enabled: false to fall back to the legacy single-loop tool calling.
harness:
  enabled: true
  budgets:
    max_instructions: 12
    max_replans: 2
    max_recoils_per_intent: 3
    max_tool_calls: 15
    wall_clock_ms: 60000
    max_turn_tokens: 30000
  binding:
    score_min: 0.55      # min semantic score to bind a capability to a tool
    ambiguity_gap: 0.08  # top hit must beat runner-up by this to auto-bind
    cache_ttl_minutes: 1440

# Sunjet (ll-server) — primary message store when enabled.
# Start ll-server first: LL_DATA_DIR=./data/sunjet LL_API_KEYS=secret cargo run --release -p ll-server
sunjet:
  enabled: false
  url: http://127.0.0.1:8080
  api_key: ${SUNJET_API_KEY}
  embed_dim: 1536
  dual_write_sqlite: true
  fallback_sqlite_on_error: true
  tables:
    messages: convox_messages
    conversations: convox_conversations
    memories: convox_memories
    compactions: convox_compactions
    runtime_state: runtime_state

storage:
  database_path: ./data/aelio.db

logging:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 3000