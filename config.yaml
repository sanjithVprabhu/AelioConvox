name: aelio-local
secret: ${AELIO_SDK_SECRET}

llm:
  # anthropic | openai | gemini | groq | ollama | mock
  # Default: OpenAI (GPT). Set OPENAI_API_KEY for real responses; without a key
  # the server degrades to the mock LLM in dev (and hard-fails in production).
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  max_tokens: 4096

# Semantic embeddings for memory + AelioDb vectors (hash = local, no API).
# openai: text-embedding-3-small (1536d) — default for solid semantic search
# gemini: text-embedding-004 (768d — set aelioDb.embed_dim: 768)
# anthropic: voyage-3-lite via Voyage API (set VOYAGE_API_KEY)
embeddings:
  provider: openai
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}
  output_dimension: 1536
  timeout_ms: 5000

channels:
  whatsapp:
    enabled: true
    mock_mode: true
    verify_token: test-verify-token
    webhook_path: /wa/webhook
  web:
    enabled: true
    # Origins allowed to open the widget WebSocket. Matched exactly on
    # scheme+host+port, so localhost and 127.0.0.1 are distinct. Use ["*"] to
    # allow any origin, or leave empty to disable the origin check (dev only).
    allowed_origins:
      - http://localhost:3010
      - http://127.0.0.1:3010
      - http://localhost:3015
      - http://127.0.0.1:3015
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
      - http://localhost:4180
      - http://127.0.0.1:4180
      - http://localhost:4174
      - http://127.0.0.1:4174
    magic_link:
      enabled: true
      ttl_minutes: 15

safety:
  default_mode: full
  require_confirmation_for: [write, destructive]
  overrides:
    cancelOrder:
      mode: write
      require_confirmation: true

identity:
  mapping_function: phone
  allow_anonymous: true

session:
  idle_timeout_minutes: 60
  history_window: 20
  summarize_after: 50

intent:
  enabled: true
  ttl_minutes: 20
  max_depth: 5

memory:
  enabled: true
  recall_limit: 5

# The harness — the plan-execute-replan turn engine. Enabled by default; set
# enabled: false to fall back to the legacy single-loop tool calling.
harness:
  enabled: true
  budgets:
    max_instructions: 12
    max_replans: 2
    max_recoils_per_intent: 3
    max_tool_calls: 15
    wall_clock_ms: 60000
    max_turn_tokens: 30000
  binding:
    score_min: 0.55      # min semantic score to bind a capability to a tool
    ambiguity_gap: 0.08  # top hit must beat runner-up by this to auto-bind
    cache_ttl_minutes: 1440

# Aelio DB is served by the same authoritative Rust aelio-server as the DSL runtime.
# There is no SQLite or secondary database fallback.
#
# Segment storage (immutable .vss index blobs — local disk or S3-compatible cloud):
# Set these in the Aelio/.env only (never commit secrets). Forward the same vars
# into the Rust aelio-server process.
#   AELIO_DB_SEGMENT_BACKEND=local|s3          (default local)
#   AELIO_DB_SEGMENT_PREFIX=prod/aelio/         (optional object-key prefix)
#   AELIO_DB_S3_BUCKET=my-bucket
#   AELIO_DB_S3_REGION=us-east-1
#   AELIO_DB_S3_ENDPOINT=http://127.0.0.1:9000 # MinIO / R2 / custom
#   AELIO_DB_S3_ACCESS_KEY_ID=...
#   AELIO_DB_S3_SECRET_ACCESS_KEY=...
#   AELIO_DB_S3_ALLOW_HTTP=1                   # local MinIO
#   AELIO_DB_S3_PATH_STYLE=1                   # MinIO path-style
aelioDb:
  enabled: true
  url: http://127.0.0.1:8090
  api_key: ${DB_API_KEY}
  embed_dim: 1536
  segment_storage:
    backend: local
  tables:
    messages: convox_messages
    conversations: convox_conversations
    memories: convox_memories
    compactions: convox_compactions
    runtime_state: runtime_state

logging:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 3010
